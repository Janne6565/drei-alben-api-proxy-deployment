apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: drei-alben-proxy
  namespace: drei-alben
  labels:
    # Grafana Alloy only selects ServiceMonitors that carry `release` and do NOT carry
    # `app.kubernetes.io/part-of` (see cluster-deployment/infrastructure/grafana-alloy.yaml).
    release: prometheus
spec:
  selector:
    matchLabels:
      app: drei-alben-proxy
  endpoints:
    - port: metrics
      path: /actuator/prometheus
      interval: 60s
      scrapeTimeout: 10s
